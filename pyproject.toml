[project]
name = "nardini-online"
version = "0.1.0"
description = "NARDINI IDR analysis as a Modal-hosted REST API, with a Colab notebook client"
authors = [{name = "Tan", email = "tan@sahaya.cloud"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=6.30.1",
    "modal>=1.1.1",
    "python-dotenv>=1.1.1",
    "requests>=2.32.4",
]

[dependency-groups]
# The web-image packages from src/app/common.py, pinned to the same versions,
# so the API runs offline under pytest.
dev = [
    "biopython==1.84",
    "fastapi==0.115.13",
    "httpx==0.28.1",
    "pytest==9.2.0",
    "python-multipart==0.0.20",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
