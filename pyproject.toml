[project]
name = "nardini-online"
version = "0.1.0"
description = "NARDINI IDR analysis as a Modal-hosted REST API, with a Colab notebook client"
authors = [{name = "Tan", email = "tan@sahaya.cloud"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.4.0",
    "modal>=1.6.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
# The web-image packages from src/app/common.py, pinned to the same versions,
# so the API runs offline under pytest.
dev = [
    "biopython==1.88",
    "fastapi==0.162.2",
    "httpx2==2.16.0",
    "pytest==9.2.0",
    "python-multipart==0.0.33",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
filterwarnings = ["error"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
